# ---------------------------------------------------------------------------
# tagmind — 显式互斥组定义
#
# 用途：C6 显式互斥组校验——同一互斥组内的标签最多命中 1 个。
# 本文件是互斥组的**外部声明**，与 label_def.exclusive_group 列互为校验：
# 两边不一致即视为体系配置损坏。
#
# 语义说明：L12 是「情感·立场·风险」层。每条 L4 主题链路各有一组
# 「看好 / 中立 / 质疑」三元组——同一主题下只能选一种立场，这就是 C6 的
# 典型场景（PRD §4.5：「如情感组『正面/负面/中立』三选一」）。
#
# 不同主题之间**不**互斥：一篇内容可以既夸技术又夸消费，不必二选一。
# ---------------------------------------------------------------------------

