# ---------------------------------------------------------------------------
# tagmind — CI
#
# 门禁：lint → typecheck → test（含覆盖率 ≥70%）→ 密钥扫描 → 依赖扫描。
#
# 任何一步失败即阻断合并。阶段 0 的验收项：③ CI 跑 lint + mypy + pytest +
# 密钥扫描 + 依赖扫描；④ 预提交钩子能拦下 sk- / AKIA / token= 模式。
# ---------------------------------------------------------------------------

name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

# 同一分支的新 push 取消旧的运行，避免浪费 CI 资源。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install "ruff>=0.4,<1"

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: mypy
        run: mypy src/tagmind

  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 单元测试 + 覆盖率
        run: pytest tests/unit -q --cov=src/tagmind --cov-report=xml --cov-report=term-missing

      - name: 覆盖率门槛
        run: |
          pytest tests/unit -q --cov=src/tagmind --cov-report=term-missing --cov-fail-under=70

      # 集成测试已移至 migration-idempotent job（那里才有真实 PostgreSQL）。
      # 本 job 只跑单元测试，避免在无 DB 环境下用 skip 制造假绿。

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 扫描疑似密钥
        run: |
          echo "== 检查 sk- 前缀密钥 =="
          if git grep -nIE "(sk-[A-Za-z0-9_-]{16,})" -- \
              ':!.env.example' ':!docs/**' ':!*.lock' ':!poetry.lock'; then
            echo "::error::检测到疑似 OpenAI 风格密钥（sk- 前缀）"
            exit 1
          fi

          echo "== 检查 AWS AKIA 密钥 =="
          if git grep -nIE "(AKIA[0-9A-Z]{16})" -- \
              ':!.env.example' ':!docs/**' ':!*.lock'; then
            echo "::error::检测到疑似 AWS Access Key（AKIA 前缀）"
            exit 1
          fi

          echo "== 检查硬编码 token/secret/password =="
          if git grep -nIE "(token|secret|password|api[_-]?key)[[:space:]]*[=:][[:space:]]*['\"][A-Za-z0-9/+_-]{16,}" -- \
              ':!.env.example' ':!docs/**' ':!tests/**' ':!*.lock'; then
            echo "::error::检测到疑似硬编码凭据"
            exit 1
          fi

          echo "::notice::密钥扫描通过"

  dependency-scan:
    name: Dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装 pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: 依赖漏洞扫描
        run: |
          pip-audit --strict --progress-spinner=off -r <(python -c "
          import tomllib, pathlib
          data = tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))
          for dep in data['project']['dependencies']:
              print(dep)
          ")

  migration-idempotent:
    name: Migration idempotency
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: tagmind
          POSTGRES_USER: tagmind
          POSTGRES_PASSWORD: tagmind
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tagmind -d tagmind"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # alembic/env.py 与 scripts/consistency_check.py 读的是 TAGMIND_DATABASE_URL；
      # 集成测试 fixture 读 TAGMIND_TEST_DATABASE_URL。两者必须同时给出，
      # 否则迁移会回退到 Settings 派生值（密码为空）而连接失败。
      TAGMIND_DATABASE_URL: postgresql+psycopg://tagmind:tagmind@localhost:5432/tagmind
      TAGMIND_TEST_DATABASE_URL: postgresql+psycopg://tagmind:tagmind@localhost:5432/tagmind
      TAGMIND_POSTGRES_PASSWORD: tagmind
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: alembic upgrade head（两次都必须成功）
        run: |
          alembic -c alembic.ini upgrade head
          alembic -c alembic.ini upgrade head

      - name: 迁移后一致性校验
        run: python scripts/consistency_check.py --after-migration head

      # 此前 test job 没有 PG service，39 条集成测试恒 skip（恒绿但零验证）。
      # 这里复用本 job 已有的真实 PostgreSQL 与 TAGMIND_TEST_DATABASE_URL，
      # 让 T02 的 5 条 DB 验收项在 CI 里真跑、真失败。
      - name: 集成测试（真实 PostgreSQL，硬失败）
        run: pytest tests/integration -q -m integration
