# ---------------------------------------------------------------------------
# tagmind — L4 主题簇（Topic）
#
# 层级定位：具体议题 / 概念 / 事件簇。严格树（同父互斥），配额 ≤3。
# 数量：约 500 个（每个 L3 二级类目 2–4 个）。
#
# L4 是打标的主战场：system prompt 里 L4 按需 top-N 注入（架构 §6.2），
# 因此 description 必须能让 LLM 判断「这条内容是否属于该主题簇」。
# ---------------------------------------------------------------------------

