[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tagmind"
version = "0.1.0"
description = "Enterprise-grade LLM-powered intelligent tagging and personalized content distribution system"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Nephets1010" }]
keywords = [
    "content-tagging",
    "personalization",
    "recommendation",
    "llm",
    "rag",
    "multi-label",
    "fastapi",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]

dependencies = [
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2,<3",
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.27,<1",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.1,<4",
    "redis>=5.0,<6",
    "celery>=5.3,<6",
    "numpy>=1.26,<3",
    "httpx>=0.27,<1",
    "prometheus-client>=0.20,<1",
    "python-multipart>=0.0.9",
    "PyYAML>=6.0,<7",
    "tenacity>=8.2,<9",
    "structlog>=24.1,<26",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
# Real embedding model (BGE-M3). Heavy; excluded from the default install.
embeddings = [
    "sentence-transformers>=3.0,<4",
    "FlagEmbedding>=1.2,<2",
]
# LightFM hybrid recommender.
rec = [
    "lightfm>=1.17,<2",
    "scipy>=1.11,<2",
]
# PostgreSQL vector extension support.
pgvector = [
    "pgvector>=0.3,<1",
]
# LLM client for real tagging / arbitration.
llm = [
    "openai>=1.30,<2",
    "tiktoken>=0.7,<1",
]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=4.1,<6",
    "pytest-asyncio>=0.23,<1",
    "httpx>=0.27,<1",
    "ruff>=0.4,<1",
    "mypy>=1.9,<2",
    "types-PyYAML>=6.0",
    "types-redis>=4.6,<6",
    "faker>=25.0,<30",
]
all = ["tagmind[embeddings,rec,pgvector,llm,dev]"]

[project.scripts]
tagmind = "tagmind.cli:main"

[project.urls]
Homepage = "https://github.com/Nephets1010/tagmind"
Repository = "https://github.com/Nephets1010/tagmind"
Issues = "https://github.com/Nephets1010/tagmind/issues"
Changelog = "https://github.com/Nephets1010/tagmind/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tagmind = ["py.typed"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=src/tagmind",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=xml",
    "--cov-fail-under=70",
]
markers = [
    "unit: fast, isolated unit tests",
    "integration: tests that need PostgreSQL / Redis (skipped when unavailable)",
    "slow: long-running tests",
]
filterwarnings = [
    "ignore::DeprecationWarning:pkg_resources.*",
]

[tool.coverage.run]
branch = true
source = ["src/tagmind"]
omit = [
    "*/__main__.py",
    "*/cli.py",
    "*/migrations/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# ruff 0.17+ 会格式化 Markdown 内的 Python fenced code block。docs/ 里的
# 报告与 ADR 含大量示意代码，格式化它们只会产生无意义 diff，且可能改变
# 文档中的示例语义。代码门禁范围仍是全部 .py 文件。
extend-exclude = ["*.md", "docs/**/*.md"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
    "RUF", # ruff-specific
]
ignore = [
    "E501",   # line length is handled by the formatter
    "B008",   # FastAPI Depends() in defaults is the documented idiom
    "ARG001", # protocol stubs legitimately take unused args
    # 本项目的注释与文档字符串统一用中文（架构附录 A.4 的写作规范）。
    # RUF001/002/003 检查的是「同形异码字」——它们要防的是把 a 与 а 混用
    # 这类视觉欺骗，而中文的「，。（）」不是欺骗，是正确写法。
    # 保留这三项会让中文文档无法通过 lint，因此显式关闭。
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG", "SIM", "PTH"]
"src/tagmind/api/**" = ["B008"]
# Alembic env.py must inject src/ into sys.path before importing the app
# models; the late imports are intentional and cannot be hoisted.
"migrations/env.py" = ["E402"]
# Migration revisions are standalone scripts executed by Alembic; import order
# is dictated by revision chaining rather than by isort.
"migrations/versions/**" = ["I001"]
# 异常类名由架构 §14.3 的错误码表逐字规定（IdempotencyConflict、
# PermissionDenied、ConstraintViolation…），改名会破坏错误码与类的对应关系，
# 因此这里关闭 N818 的「必须以 Error 结尾」建议。
"src/tagmind/core/errors.py" = ["N818"]

[tool.ruff.lint.isort]
known-first-party = ["tagmind"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["^tests/", "^migrations/"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["lightfm.*", "sentence_transformers.*", "FlagEmbedding.*", "torch.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# numpy 2.5 的类型存根用了 3.12+ 的 PEP 695 `type` 语句，而本项目的 mypy 目标
# 版本是 3.11（requires-python = ">=3.11"）。numpy 只在阶段 3 的向量计算里用到，
# 本阶段不需要它的类型信息，因此跳过其存根而不改动项目的目标 Python 版本。
#
# pgvector 在 TYPE_CHECKING 分支里 import numpy，因此它也要一并跳过——
# 否则 mypy 会顺着 pgvector 的注解把 numpy 的存根拉进来解析。
module = ["numpy", "numpy.*", "pgvector.*"]
follow_imports = "skip"
ignore_missing_imports = true
