# ---------------------------------------------------------------------------
# tagmind - Alembic configuration
#
# The connection string is resolved in this order:
#   1. TAGMIND_DATABASE_URL environment variable
#   2. Settings.resolved_database_url (derived from TAGMIND_POSTGRES_*)
#   3. sqlalchemy.url below (left empty on purpose)
#
# NOTE: keep this file ASCII-only. Alembic reads it with the locale codec,
# which on a GBK locale would fail on UTF-8 Chinese comments.
# ---------------------------------------------------------------------------

[alembic]
script_location = migrations
prepend_sys_path = src
version_path_separator = os
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
